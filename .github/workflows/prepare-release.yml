name: Prepare release
on:
  workflow_dispatch:
    inputs:
      source:
        description: develop for a regular release, or hotfix/name for an urgent fix
        default: develop
        required: true
        type: string
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: release-management
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ inputs.source }}
        run: node scripts/gitflow.mjs prepare "$SOURCE"
      - name: Explicitly dispatch validation
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.candidate.outputs.branch }}
          SHA: ${{ steps.candidate.outputs.sha }}
        run: gh workflow run ci.yml --ref "$BRANCH" -f "ref=$SHA"
