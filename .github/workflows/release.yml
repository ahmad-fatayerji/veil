name: Stable release
on:
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:
    inputs:
      ref:
        description: Exact merged main commit to retry after a release failure
        required: true
        type: string
permissions:
  contents: write
  pull-requests: write
  actions: write
jobs:
  source:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       (startsWith(github.event.pull_request.head.ref, 'release/') || startsWith(github.event.pull_request.head.ref, 'hotfix/')))
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  validate:
    needs: source
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.source.outputs.sha }}
      candidate: true
  build:
    needs: source
    uses: ./.github/workflows/build-release.yml
    with:
      ref: ${{ needs.source.outputs.sha }}
  publish:
    needs: [source, validate, build]
    uses: ./.github/workflows/publish.yml
    with:
      ref: ${{ needs.source.outputs.sha }}
      branch: main
      artifact: ${{ needs.build.outputs.artifact }}
    secrets: inherit
  backmerge:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/gitflow.mjs backmerge
