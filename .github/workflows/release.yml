name: Stable release
on:
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:
    inputs:
      ref:
        description: Exact merged main commit to retry after a release failure
        required: true
        type: string
permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read
jobs:
  source:
    if: >-
      github.repository == 'ahmad-fatayerji/veil' && vars.RELEASE_PUBLICATION_ENABLED == 'true' &&
      (
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       (startsWith(github.event.pull_request.head.ref, 'release/') || startsWith(github.event.pull_request.head.ref, 'hotfix/')))
      )
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      reuse: ${{ steps.reuse.outputs.reuse }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      # The release PR already ran full validation on its merge result. When the merged
      # commit has that exact tree, validating it again only repeats the same checks.
      - id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-plan.mjs reuse
  validate:
    needs: source
    if: needs.source.outputs.reuse != 'true'
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.source.outputs.sha }}
      candidate: true
  build:
    needs: source
    uses: ./.github/workflows/build-release.yml
    with:
      ref: ${{ needs.source.outputs.sha }}
  publish:
    needs: [source, validate, build]
    if: >-
      always() && needs.source.result == 'success' && needs.build.result == 'success' &&
      (needs.validate.result == 'success' ||
      (needs.validate.result == 'skipped' && needs.source.outputs.reuse == 'true'))
    uses: ./.github/workflows/publish.yml
    with:
      ref: ${{ needs.source.outputs.sha }}
      branch: main
      artifact: ${{ needs.build.outputs.artifact }}
    secrets: inherit
  backmerge:
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/gitflow.mjs backmerge
