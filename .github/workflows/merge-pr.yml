name: Merge Gitflow PR
on:
  workflow_dispatch:
    inputs:
      number:
        description: Ready PR number; required checks must already pass
        required: true
        type: string
permissions:
  contents: write
  pull-requests: write
  actions: write
jobs:
  merge:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.number }}
        run: node scripts/gitflow.mjs merge-pr "$PR_NUMBER"
